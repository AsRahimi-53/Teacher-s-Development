# Netlify config — SPA fallback + sensible caching
[build]
  # Static site: no build step (all assets are pre-bundled)
  publish = "."

# Every route serves index.html (the app is hash-routed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache immutable hashed/static assets
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The service worker must never be stale
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
