<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e7568">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>

<div id="memoryWarn" class="memory-warn" hidden>
  <strong>⚠</strong><span id="memoryWarnText"></span>
</div>

<div id="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle"></div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav" aria-label="main"></nav>
    <div class="sidebar-foot" id="sidebarFoot">
      <div class="year-chip" id="sidebarYear"></div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ MAIN ============ -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="menu"></button>
      <button class="icon-btn back-btn" id="btnBack" aria-label="back" title="back"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <div class="header-acct" id="headerAcct" hidden></div>
        <button type="button" class="icon-btn" id="installBtn" hidden></button>
        <div class="sync-badge" id="syncBadge" hidden></div>
        <div class="global-search" id="globalSearchWrap">
          <span class="gs-icon"></span>
          <input id="globalSearch" autocomplete="off" aria-label="search">
          <div class="gs-results" id="globalSearchResults" hidden></div>
        </div>
        <div class="lang-switch" id="langSwitch">
          <button type="button" data-lang="ps">پښتو</button>
          <button type="button" data-lang="fa">دری</button>
        </div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- bottom navigation (phones / installed app) -->
<nav class="bottom-nav" id="bottomNav" aria-label="bottom"></nav>

<!-- modal / toast / print roots -->
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>
